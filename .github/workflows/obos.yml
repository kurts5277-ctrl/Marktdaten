name: obos
on:
  schedule:
    - cron: '45 22 * * 1-5'   # nach US-Börsenschluss (Sommer- und Winterzeit)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas lxml requests
      - run: mkdir -p data && python scripts/obos.py
      - name: Datei einchecken
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/obos_sp500.json
          git diff --staged --quiet || (git commit -m "obos: Marktstimmung aktualisiert" && git pull --rebase && git push)
