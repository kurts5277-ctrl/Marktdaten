name: Marktbreite
on:
  push:
    paths:
      - "breadth.py"
      - "stress.py"
      - ".github/workflows/breadth.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - run: python breadth.py
      - run: python stress.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Ergebnis speichern
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)

